<title>ねりけし作るよ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen classroom seen from the player's seat. Blackboard + teacher on top, classmates in the middle, your desk at the bottom. A green "pencil case" HUD strip sits above; menus are notebook cards. Single look (school) on purpose. */
:root{
  --desk:#c49461;        /* wooden desk / letterbox */
  --desk-dark:#9c6d40;
  --paper:#fbfaf3;       /* notebook paper */
  --rule:#bcd5e8;
  --margin:#e9a3a0;
  --graphite:#34363d;    /* text */
  --mute:#7b7d86;
  --board:#2f5a45;       /* blackboard green, the one accent */
  --chalk:#f3ead0;
  --alert:#d8473d;       /* teacher looking / caught */
  --display:"Yusei Magic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--desk);color:var(--graphite);font-family:var(--body);
  overflow:hidden;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background-image:
    repeating-linear-gradient(92deg,rgba(255,255,255,.05) 0 3px,transparent 3px 19px),
    repeating-linear-gradient(88deg,rgba(80,40,10,.07) 0 2px,transparent 2px 31px),
    linear-gradient(180deg,#cf9f6b,var(--desk) 40%,var(--desk-dark));
}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box;max-width:620px;margin:0 auto}
#hud{background:var(--board);color:var(--chalk);border-radius:12px;padding:8px 12px 9px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#tname{font-size:13px;font-weight:800;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strikes{font-size:13px;font-weight:800;white-space:nowrap;display:flex;gap:4px;align-items:center}
#strikes i{display:inline-block;width:12px;height:16px;border-radius:2px;background:rgba(243,234,208,.25)}
#strikes i.on{background:#f2c94c}
#len{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
#len small{font-size:15px;margin-left:2px}
#noise{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
#noise b{display:block;width:80px;height:8px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
#noiseFill{display:block;height:100%;width:100%;background:var(--chalk);transform-origin:left;transform:scaleX(0)}
#noise.hot #noiseFill{background:#f2994a}
#bar{grid-column:1/-1;height:6px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden}
#barFill{display:block;height:100%;width:100%;background:var(--chalk);transform-origin:left}
#stage{position:relative;flex:1;min-height:0;border-radius:6px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-3deg);font-family:var(--display);font-size:clamp(24px,7vw,40px);color:var(--graphite);background:var(--paper);padding:10px 22px;border-radius:6px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 0 0 3px var(--graphite);text-align:center;line-height:1.25;pointer-events:none;animation:pop .35s cubic-bezier(.3,1.6,.6,1);max-width:86%;box-sizing:border-box}
#banner.bad{color:var(--paper);background:var(--alert);box-shadow:0 6px 0 rgba(0,0,0,.15),0 0 0 3px #7c1f19}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-3deg) scale(.4);opacity:0}}
.btn{font-family:var(--body);font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--board);color:var(--chalk);box-shadow:0 4px 0 #1b3a2b;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b3a2b}
.btn.ghost{background:transparent;color:var(--graphite);box-shadow:inset 0 0 0 2px var(--graphite)}
.btn:focus-visible,.tcard:focus-visible,#muteBtn:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
.ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:14px;background:rgba(40,25,10,.35);overflow-y:auto}
.card{width:100%;max-width:440px;background:var(--paper);border-radius:8px;padding:22px 18px 20px 34px;box-sizing:border-box;position:relative;box-shadow:0 10px 24px rgba(40,20,0,.28);
  background-image:linear-gradient(90deg,transparent 22px,var(--margin) 22px 24px,transparent 24px),repeating-linear-gradient(180deg,transparent 0 27px,var(--rule) 27px 28px);
  display:flex;flex-direction:column;gap:14px;margin:auto}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.05;margin:0;text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.card p{margin:0;line-height:1.7;font-size:14px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--mute)}
.how{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;line-height:1.5;margin:0}
.how dt{font-weight:800}.how dd{margin:0}
#tlist{display:flex;flex-direction:column;gap:10px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;font-family:var(--body);color:var(--graphite);background:var(--paper);border:2px solid var(--graphite);border-radius:10px;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 var(--graphite)}
.tcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--graphite)}
.tcard canvas{grid-row:1/4;width:56px;height:56px;align-self:center}
.tcard b{font-size:16px}
.tcard .st{color:var(--alert);letter-spacing:.1em;font-size:13px;margin-left:6px}
.tcard .hb{font-size:12.5px;line-height:1.5}
.tcard .bs{font-size:12px;color:var(--mute);font-weight:800}
#rank{position:absolute;right:16px;top:14px;font-family:var(--display);font-size:40px;width:64px;height:64px;border-radius:50%;border:3px solid var(--alert);color:var(--alert);display:flex;align-items:center;justify-content:center;transform:rotate(12deg)}
#resLen{font-family:var(--display);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
#resLen small{font-size:22px;margin-left:4px}
#resNew{color:var(--alert);font-weight:800;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1 1 auto}
#muteBtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);color:var(--graphite);font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer;z-index:5}
body.playing #muteBtn{display:none}
@media (prefers-reduced-motion:reduce){#banner{animation:none}}
</style>

<div id="app">
  <header id="hud">
    <div id="tname">ねりけし作るよ</div>
    <div id="strikes">ちゅうい <i></i><i></i></div>
    <div id="len">0.0<small>cm</small></div>
    <div id="noise">ガサゴソ<b><i id="noiseFill"></i></b></div>
    <div id="bar"><i id="barFill"></i></div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="banner" hidden></div>

    <section class="ov" id="titleOv">
      <div class="card">
        <div class="lbl">じゅぎょう中の ひみつ作戦</div>
        <h1>ねりけし作るよ</h1>
        <p>先生が 黒板に 書いている あいだに、ねりけしを こっそり のばそう。じゅぎょうが おわったときの 長さが スコアだよ。</p>
        <dl class="how">
          <dt>おす</dt><dd>画面を おしている あいだ、ねりけしが のびる。長く おすほど はやく のびる。</dd>
          <dt>はなす</dt><dd>まじめに ノートを とるフリ。先生が ふりむく前に はなそう。</dd>
          <dt>ちゅうい</dt><dd>1回目は ねりけしが 半分に。2回目は ぼっしゅう！</dd>
          <dt>ガサゴソ</dt><dd>はやく のばしすぎると 音で ばれて、先生が ふりむくよ。</dd>
        </dl>
        <div class="lbl">どの先生の じゅぎょう？</div>
        <div id="tlist"></div>
      </div>
    </section>

    <section class="ov" id="resultOv" hidden>
      <div class="card">
        <div id="rank">A</div>
        <div class="lbl" id="resHead">じゅぎょう おわり！</div>
        <div id="resLen">0<small>cm</small></div>
        <p id="resCmp"></p>
        <p id="resMsg"></p>
        <div id="resNew"></div>
        <div class="btns">
          <button class="btn" id="againBtn">もういちど</button>
          <button class="btn ghost" id="pickBtn">先生を えらぶ</button>
        </div>
      </div>
    </section>
  </main>
</div>
<button id="muteBtn" aria-label="おと オン/オフ">♪</button>

<script>
(()=>{
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ---------- teachers ---------- */
const TEACHERS=[
 {id:'tanaka',name:'たなか先生',subj:'こくご',stars:1,
  habit:'ふりむく前に かならず「えーと…」と言う。ふりむくのも ゆっくり。',
  write:[3.5,6],tell:1.0,tellShow:1,bubble:'えーと…',turn:.75,look:[1.5,2.5],fake:0,dbl:0,ear:.5,rankMul:1,
  hair:'#c9c4bd',style:'bun',skin:'#f1d3b8',shirt:'#d8c095',glasses:'round',
  lines:['きょうの かん字','山 川 森 林','はるが きました','音読 しましょう','ていねいに 書こう','ことばの たんけん']},
 {id:'suzuki',name:'すずき先生',subj:'さんすう',stars:2,
  habit:'きっちり 4びょうごとに ふりむく。チョークの 音が 止まったら 合図。',
  write:[3.6,3.6],tell:.45,tellShow:1,bubble:'',turn:.4,look:[1.4,1.4],fake:0,dbl:0,ear:1,rankMul:.85,
  hair:'#26262b',style:'neat',skin:'#efcfae',shirt:'#f4f4f0',tie:'#2f5aa8',glasses:'square',
  lines:['3×4＝12','12÷3＝4','7×8＝56','24÷6＝4','ひっ算の しかた','9×9＝81']},
 {id:'yamada',name:'やまだ先生',subj:'りか',stars:3,
  habit:'「ん？」と言ってから ふりむく。でも フリが 多いし、もう一回 見てくることも。',
  write:[2,5],tell:.8,tellShow:1,bubble:'ん？',turn:.45,look:[1.2,2],fake:.35,dbl:.35,ear:1,rankMul:.7,
  hair:'#6b4a2e',style:'messy',skin:'#f0cfb0',shirt:'#fbfbf8',coat:true,glasses:'',
  lines:['じしゃくの ふしぎ','N極 と S極','てこの はたらき','電気の 通り道','かんさつ しよう','よそうを たてる']},
 {id:'gouda',name:'ごうだ先生',subj:'ほけん',stars:4,
  habit:'「ムッ」の合図から すぐ ふりむく。いつ ふりむくか 読めない。地獄耳で 音にも びんかん。',
  write:[1.5,4.5],tell:.55,tellShow:1,bubble:'ムッ',turn:.3,look:[1,2.5],fake:.15,dbl:.3,ear:1.6,rankMul:.6,
  hair:'#1d1d20',style:'buzz',skin:'#d9a982',shirt:'#c9473d',whistle:true,glasses:'',
  lines:['ほけんの じかん','よく ねる','よく たべる','よく うごく','ちゃんと きく','あそばない！']},
];

/* ---------- storage ---------- */
const KEY='nerikeshi.v2';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return{best:d.best&&typeof d.best==='object'?d.best:{},muted:!!d.muted}}catch(e){return{best:{},muted:false}}}
let SAVE=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){}}

/* ---------- sound ---------- */
let AC=null,noiseBuf=null;
function ac(){
  if(SAVE.muted)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;
}
function tone(f,t0,dur,type='sine',vol=.1,f2){const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function chalkSnd(){const a=ac();if(!a)return;const t=a.currentTime;const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=2500;
  const g=a.createGain();g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+.04)}
function chime(){[[659,0],[523,.45],[587,.9],[392,1.35],[392,2.0],[587,2.45],[659,2.9],[523,3.35]].forEach(([f,t])=>tone(f,t,.6,'triangle',.09))}
function buzzer(){tone(150,0,.45,'sawtooth',.08,120);tone(155,0,.45,'square',.04,118)}
function sadSnd(){[[392,0],[370,.3],[349,.6],[330,.9]].forEach(([f,t],i)=>tone(f,t,i==3?.8:.3,'triangle',.1,i==3?260:undefined))}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- view: fixed 420×720 world ---------- */
const W=420,H=720;
let dpr=1,cssW=300,cssH=400,S=1,OX=0,OY=0;
function resize(){const r=stage.getBoundingClientRect();cssW=Math.max(100,r.width);cssH=Math.max(100,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  S=Math.min(cssW/W,cssH/H);OX=(cssW-W*S)/2;OY=(cssH-H*S)/2}
window.addEventListener('resize',resize);

/* ---------- state ---------- */
const CLASS_LEN=60;
let phase='title',TCH=TEACHERS[0],tClass=0,phaseT=0;
let needRelease=false,L=4,held=0,holding=false,noise=0,strikes=0,confiscated=false,squeakT=0,shake=0,lastRate=0;
let T=null;
function newTeacher(){
  T={st:'write',t:0,dur:2.5,f:0,x:120,tx:120,bubble:'',showTell:false,fakeNext:false,dblLeft:false,chars:0,line:0,page:0,chalkT:0,angry:0,heard:false};
}
function tGo(st,dur){T.st=st;T.t=0;T.dur=dur}
function nextWrite(){tGo('write',rand(...TCH.write))}

/* ---------- input ---------- */
let pid=null,keyHeld=false;
cv.addEventListener('pointerdown',e=>{ac();if(pid!==null)return;pid=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
function pend(e){if(e.pointerId===pid)pid=null}
cv.addEventListener('pointerup',pend);cv.addEventListener('pointercancel',pend);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){if(phase!=='title')e.preventDefault();ac();keyHeld=true}});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')keyHeld=false});
window.addEventListener('blur',()=>{pid=null;keyHeld=false});
const pressing=()=>pid!==null||keyHeld;

/* ---------- flow ---------- */
function banner(txt,bad=false){const b=$('#banner');b.innerHTML=txt;b.className=bad?'bad':'';b.hidden=false;b.style.animation='none';b.offsetHeight;b.style.animation=''}
function hideBanner(){$('#banner').hidden=true}
function startClass(t){
  TCH=t;ac();resize();
  $('#titleOv').hidden=true;$('#resultOv').hidden=true;
  L=4;held=0;holding=false;noise=0;strikes=0;confiscated=false;tClass=0;phaseT=0;shake=0;
  newTeacher();
  phase='intro';document.body.classList.add('playing');
  $('#tname').textContent=`${t.subj} ・ ${t.name}`;
  banner(`キーンコーンカーンコーン<br><small style="font-size:.55em">${t.subj}の じゅぎょう</small>`);
  chime();hud();
}
function caught(){
  strikes++;holding=false;needRelease=true;held=0;noise=0;shake=1;
  T.angry=1;T.f=1;
  phase='caught';phaseT=0;
  buzzer();vib([60,40,60]);
  if(strikes>=2){confiscated=true;banner('こらっ！<br>ぼっしゅう！',true)}
  else{banner('こらっ！<br><small style="font-size:.5em">ねりけしで あそばない！</small>',true)}
}
function endClass(){
  phase='end';phaseT=0;holding=false;
  T.angry=0;tGo('end',9);
  banner('キーンコーンカーンコーン<br><small style="font-size:.55em">はい、きょうは ここまで</small>');
  chime();
}
function showResult(){
  phase='result';document.body.classList.remove('playing');hideBanner();
  const len=confiscated?0:L;
  const m=TCH.rankMul;
  const rank=confiscated?'×':len>=170*m?'S':len>=110*m?'A':len>=60*m?'B':'C';
  $('#rank').textContent=rank;
  $('#resHead').textContent=`${TCH.subj} ・ ${TCH.name}`;
  $('#resLen').innerHTML=`${len.toFixed(1)}<small>cm</small>`;
  $('#resCmp').textContent=confiscated?'ねりけしは 先生の つくえの 引き出しへ…。':compare(len);
  $('#resMsg').textContent=confiscated?'ほうかごに 先生の ところへ 取りに 行こう。':
    {S:'でんせつの ねりけし職人！ クラスじゅうの うわさに なるよ。',A:'すごい！ となりの席の子も びっくり。',B:'なかなか。もう少し 大たんに のばしてみよう。',C:'先生が こわくて 手が 止まりがち？ 合図を よく見よう。'}[rank];
  const prev=SAVE.best[TCH.id]||0;
  if(!confiscated&&len>prev){SAVE.best[TCH.id]=+len.toFixed(1);save();$('#resNew').textContent=prev?`しんきろく！（まえは ${prev.toFixed(1)}cm）`:'はじめての きろく！'}
  else $('#resNew').textContent=prev?`じこベスト ${prev.toFixed(1)}cm`:'';
  $('#resultOv').hidden=false;
  if(confiscated)sadSnd();else{tone(784,0,.15,'triangle',.1);tone(1047,.12,.3,'triangle',.1)}
  buildTitle();
}
function compare(cm){
  const items=[[360,'黒板の よこはば'],[150,'きみの せの高さ ぐらい'],[60,'つくえの よこはば'],[30,'ものさし'],[17,'えんぴつ']];
  for(const[s,n]of items){if(cm>=s){const k=cm/s;return k<1.15?`${n}と 同じくらい！`:`${n} ${k.toFixed(1)}こぶん！`}}
  return `えんぴつ ${(cm/17).toFixed(1)}本ぶん。`;
}

/* ---------- teacher brain ---------- */
function updTeacher(dt,canCatch){
  T.t+=dt;const tc=TCH;
  switch(T.st){
    case 'write':
      T.f=0;T.showTell=false;T.bubble='';
      T.chars+=dt*5.5;T.chalkT-=dt;if(T.chalkT<=0){T.chalkT=rand(.09,.16);if(phase==='play'||phase==='intro')chalkSnd()}
      if(canCatch&&noise>=1){noise=.5;T.bubble='ん？';T.showTell=true;T.fakeNext=false;tGo('tell',Math.max(.5,tc.tell));break}
      if(T.t>=T.dur){
        if(T.dblLeft){T.dblLeft=false;T.fakeNext=false;T.showTell=true;T.bubble=tc.bubble||'…';tGo('tell',tc.tell);break}
        T.fakeNext=Math.random()<tc.fake;
        T.showTell=Math.random()<tc.tellShow;T.bubble=T.showTell?tc.bubble:'';
        tGo('tell',tc.tell)}
      break;
    case 'tell':T.f=T.showTell?.04+Math.sin(T.t*30)*.015:0;
      if(T.t>=T.dur){if(T.fakeNext)tGo('fake',tc.turn*2.2);else tGo('turn',tc.turn)}break;
    case 'turn':T.f=ease(clamp(T.t/T.dur,0,1));if(T.t>=T.dur){T.bubble='';tGo('look',rand(...tc.look))}break;
    case 'look':T.f=1;if(T.t>=T.dur)tGo('back',tc.turn*1.3);break;
    case 'back':T.f=1-ease(clamp(T.t/T.dur,0,1));if(T.t>=T.dur){
        if(!T.dblDone&&Math.random()<tc.dbl){T.dblLeft=true;T.dblDone=true;tGo('write',rand(.45,.8))}
        else{T.dblDone=false;nextWrite()}}break;
    case 'fake':T.f=.42*Math.sin(Math.PI*clamp(T.t/T.dur,0,1));if(T.t>=T.dur){T.bubble='';tGo('write',rand(.8,2))}break;
    case 'scold':T.f=1;if(T.t>=T.dur){T.angry=0;tGo('back',tc.turn*1.3)}break;
    case 'end':T.f=Math.min(1,T.f+dt*2);break;
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;phaseT+=dt;
  if(phase==='intro'){
    updTeacher(dt,false);
    if(phaseT>2.4){hideBanner();phase='play';phaseT=0}
  }else if(phase==='play'){
    tClass+=dt;
    if(!pressing())needRelease=false;holding=pressing()&&!needRelease;
    if(holding){held+=dt;const rate=.6+1.4*Math.min(held,3);lastRate=rate;L+=rate*dt;
      noise+=Math.pow(rate/4.8,2)*.38*TCH.ear*dt;
      squeakT-=dt;if(squeakT<=0){squeakT=.16;tone(260+rate*45,0,.09,'sine',.03,200+rate*30)}}
    else{held=0;lastRate=0;noise=Math.max(0,noise-.45*dt)}
    noise=Math.min(1,noise);
    updTeacher(dt,true);
    if(holding&&T.f>.55)caught();
    else if(tClass>=CLASS_LEN)endClass();
  }else if(phase==='caught'){
    T.f=1;
    if(phaseT>1.7){hideBanner();
      if(confiscated){L=0;showResult()}
      else{L=Math.max(2,L*.5);phase='play';tGo('scold',.4);T.angry=1}}
  }else if(phase==='end'){
    updTeacher(dt,false);
    if(phaseT>2.6)showResult();
  }else if(phase==='title'||phase==='result'){
    if(!T)newTeacher();
    updTeacher(dt,false);
  }
  shake*=Math.pow(.02,dt);
  render(now/1000);
  if(phase!=='title'&&phase!=='result')hud();
  requestAnimationFrame(frame);
}

/* ---------- HUD ---------- */
function hud(){
  $('#len').innerHTML=`${(confiscated?0:L).toFixed(1)}<small>cm</small>`;
  document.querySelectorAll('#strikes i').forEach((el,i)=>el.classList.toggle('on',i<strikes));
  $('#noiseFill').style.transform=`scaleX(${noise})`;$('#noise').classList.toggle('hot',noise>.7);
  $('#barFill').style.transform=`scaleX(${1-clamp(tClass/CLASS_LEN,0,1)})`;
}

/* the player's desk and the neri-keshi rope */
const ROPE={x0:36,x1:384,y0:486};
function ropePath(len){
  const thick=clamp(15*Math.sqrt(5/Math.max(len,1)),3.2,15),gap=Math.max(thick*1.6,9);
  const rows=Math.max(1,Math.floor((588-ROPE.y0)/gap)),rowW=ROPE.x1-ROPE.x0,cap=rows*(rowW+gap*1.57);
  const ppc=Math.min(5,cap/len),px=len*ppc;
  const pts=[];let acc=0,row=0,x=ROPE.x0,y=ROPE.y0,dir=1;pts.push([x,y]);
  const step=3;
  while(acc<px){
    const end=dir>0?ROPE.x1:ROPE.x0,rem=Math.abs(end-x);
    if(rem>.5){const d=Math.min(step,rem,px-acc);x+=dir*d;acc+=d;pts.push([x,y]);continue}
    // U-turn
    const r=gap/2,cx=x,cy=y+r,arcLen=Math.PI*r;let a=0;
    while(a<arcLen&&acc<px){const d=Math.min(step,arcLen-a,px-acc);a+=d;acc+=d;const th=-Math.PI/2+a/r;pts.push([cx+dir*Math.cos(th)*r,cy+Math.sin(th)*r])}
    y+=gap;dir=-dir;row++;
    if(row>=rows+3)break;
  }
  return{pts,thick};
}

    const c=document.createElement('canvas');c.width=c.height=112;b.appendChild(c);drawFace(c,tc);
    const best=SAVE.best[tc.id];
    b.insertAdjacentHTML('beforeend',`<div><b></b><span class="st">${'★'.repeat(tc.stars)}${'☆'.repeat(4-tc.stars)}</span></div><div class="hb"></div><div class="bs">${best?`じこベスト ${best.toFixed(1)}cm`:'まだ きろくなし'}</div>`);
    b.querySelector('b').textContent=`${tc.name}（${tc.subj}）`;b.querySelector('.hb').textContent=tc.habit;
    b.addEventListener('click',()=>startClass(tc));box.appendChild(b)});
}
$('#againBtn').addEventListener('click',()=>startClass(TCH));
$('#pickBtn').addEventListener('click',()=>{$('#resultOv').hidden=true;$('#titleOv').hidden=false;phase='title';$('#titleOv').scrollTop=0});
$('#muteBtn').addEventListener('click',()=>{SAVE.muted=!SAVE.muted;save();$('#muteBtn').textContent=SAVE.muted?'×':'♪';if(!SAVE.muted)ac()});
